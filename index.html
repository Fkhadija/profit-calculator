<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exchange Office Profit Calculator</title>
    <!-- Tailwind CSS for styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- SheetJS for reading Excel files -->
    <script src="https://cdn.sheetjs.com/xlsx-latest/package/dist/xlsx.full.min.js"></script>
</head>
<body class="bg-gray-100 min-h-screen p-8 font-sans text-gray-800">

    <div class="max-w-2xl mx-auto bg-white p-8 rounded-lg shadow-md border-t-4 border-blue-600">
        <h1 class="text-2xl font-bold mb-6 text-gray-900">Euro Transaction Profit Calculator</h1>
        
        <div class="space-y-6">
            <!-- File Upload Section -->
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-2">1. Upload Buying History (Excel)</label>
                <input type="file" id="fileUpload" accept=".xlsx, .xls" 
                    class="block w-full text-sm text-gray-500
                    file:mr-4 file:py-2 file:px-4
                    file:rounded-md file:border-0
                    file:text-sm file:font-semibold
                    file:bg-blue-50 file:text-blue-700
                    hover:file:bg-blue-100 border border-gray-300 rounded-md p-2">
            </div>

            <hr class="border-gray-200">

            <!-- Manual Input Section -->
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">2. Bank Sale Amount (EUR)</label>
                    <input type="number" id="saleAmount" placeholder="e.g. 471465" 
                        class="w-full border border-gray-300 rounded-md p-2 focus:ring-blue-500 focus:border-blue-500">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">3. Bank Exchange Rate</label>
                    <input type="number" id="saleRate" placeholder="e.g. 10.62" step="0.01" 
                        class="w-full border border-gray-300 rounded-md p-2 focus:ring-blue-500 focus:border-blue-500">
                </div>
            </div>

            <!-- Action Button -->
            <button onclick="calculateProfit()" 
                class="w-full bg-blue-600 text-white font-bold py-3 px-4 rounded-md hover:bg-blue-700 transition duration-300">
                Calculate Profit
            </button>
        </div>

        <!-- Results Section (Hidden by default) -->
        <div id="resultsDiv" class="mt-8 hidden">
            <h2 class="text-xl font-bold mb-4 text-gray-900 border-b pb-2">Calculation Results</h2>
            
            <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                <div class="bg-gray-50 p-4 rounded-md border border-gray-200">
                    <p class="text-xs text-gray-500 font-semibold uppercase">Avg. Buying Rate</p>
                    <p id="avgRateDisplay" class="text-lg font-bold text-gray-800 mt-1">-- MAD/EUR</p>
                </div>
                
                <div class="bg-gray-50 p-4 rounded-md border border-gray-200">
                    <p class="text-xs text-gray-500 font-semibold uppercase">Total Cost (COGS)</p>
                    <p id="cogsDisplay" class="text-lg font-bold text-gray-800 mt-1">-- MAD</p>
                </div>
                
                <div class="bg-green-50 p-4 rounded-md border border-green-200">
                    <p class="text-xs text-green-700 font-semibold uppercase">Net Profit</p>
                    <p id="profitDisplay" class="text-xl font-bold text-green-700 mt-1">-- MAD</p>
                </div>
            </div>
        </div>
    </div>

    <!-- Application Logic -->
    <script>
        function calculateProfit() {
            const fileInput = document.getElementById('fileUpload');
            const saleAmount = parseFloat(document.getElementById('saleAmount').value);
            const saleRate = parseFloat(document.getElementById('saleRate').value);

            // Validation
            if (!fileInput.files.length) {
                alert("Please upload the 'operation_achat_view' Excel file first.");
                return;
            }
            if (isNaN(saleAmount) || isNaN(saleRate)) {
                alert("Please enter valid numerical values for the Bank Sale Amount and Rate.");
                return;
            }

            const file = fileInput.files[0];
            const reader = new FileReader();

            reader.onload = function(e) {
                try {
                    // Read and parse the Excel file
                    const data = new Uint8Array(e.target.result);
                    const workbook = XLSX.read(data, {type: 'array'});
                    
                    // Assume data is on the first sheet
                    const firstSheetName = workbook.SheetNames[0];
                    const worksheet = workbook.Sheets[firstSheetName];
                    
                    // Convert sheet to an array of arrays
                    const jsonData = XLSX.utils.sheet_to_json(worksheet, {header: 1});

                    let totalEur = 0;
                    let totalMad = 0;

                    // Loop through the rows to extract EUR data
                    jsonData.forEach(row => {
                        // In your specific Excel file:
                        // Column index 24 contains the MAD amount paid
                        // Column index 25 contains the Currency string (e.g., 'EUR')
                        // Column index 39 contains the EUR amount bought
                        if (row && row[25] === 'EUR') {
                            const madAmount = parseFloat(row[24]) || 0;
                            const eurAmount = parseFloat(row[39]) || 0;
                            
                            totalEur += eurAmount;
                            totalMad += madAmount;
                        }
                    });

                    if (totalEur === 0) {
                        alert("No EUR transactions found in this file. Please check the file format.");
                        return;
                    }

                    // Perform the final calculations
                    const avgBuyRate = totalMad / totalEur;
                    const cogs = saleAmount * avgBuyRate;
                    const saleMad = saleAmount * saleRate;
                    const profit = saleMad - cogs;

                    // Update the HTML display with the results
                    document.getElementById('avgRateDisplay').innerText = avgBuyRate.toFixed(4) + " MAD";
                    document.getElementById('cogsDisplay').innerText = cogs.toLocaleString('fr-FR', { minimumFractionDigits: 2, maximumFractionDigits: 2 }) + " MAD";
                    document.getElementById('profitDisplay').innerText = profit.toLocaleString('fr-FR', { minimumFractionDigits: 2, maximumFractionDigits: 2 }) + " MAD";

                    // Make the results section visible
                    document.getElementById('resultsDiv').classList.remove('hidden');

                } catch (error) {
                    console.error("Error processing file:", error);
                    alert("An error occurred while reading the file. Make sure it is a valid Excel format.");
                }
            };

            // Trigger the file reading process
            reader.readAsArrayBuffer(file);
        }
    </script>
</body>
</html>
